name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lockfile resolves from the public registry only
        run: |
          if grep -Eq 'npm\.shopify\.io|package-proxy\.shopify\.io' package-lock.json; then
            echo "package-lock.json references an internal registry; regenerate it against registry.npmjs.org" >&2
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
