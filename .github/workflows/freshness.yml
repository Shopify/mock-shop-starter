name: Sync with the latest Hydrogen template

# Re-downloads Hydrogen's published React Router template every week and opens a PR when
# anything the template owns has drifted, so galleries never showcase a stale starter.
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Download the latest template
        run: |
          # The tarball `npx @shopify/hydrogen setup` scaffolds from: Hydrogen's dist branch
          # carries the React Router template as published with the latest release.
          curl -fsSL -o /tmp/hydrogen-dist.tar.gz https://codeload.github.com/Shopify/hydrogen/tar.gz/dist
          mkdir -p /tmp/fresh
          tar -xzf /tmp/hydrogen-dist.tar.gz --strip-components=3 -C /tmp/fresh hydrogen-dist/templates/react-router/
      - name: Copy template-owned files over the starter
        run: |
          # Everything the template ships is template-owned, including its agent skills, AGENTS.md,
          # .env.example, and lockfile, except the files this repo adds or rewrites. The leading
          # slash anchors each pattern to the repository root, so a file with one of these names
          # deeper in the template (a skill's scripts/ or README.md, say) still syncs.
          rsync -a --delete \
            --exclude /README.md --exclude /llms.txt --exclude /LICENSE --exclude /LICENSE.md \
            --exclude /.env --exclude /.github --exclude /scripts --exclude /.cursor/rules/mock-shop.mdc \
            --exclude /.codesandbox --exclude /.stackblitzrc --exclude /.devcontainer --exclude /.git \
            /tmp/fresh/ ./
          # Restores this repo's package name and re-applies its edits to template files. The
          # lockfile is the template's own, so nothing is installed here: a different npm
          # version would only rewrite it.
          node scripts/patch-template.mjs
      - name: Open a pull request if anything changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: chore/sync-hydrogen-template
          title: "Sync with the latest Hydrogen template"
          commit-message: "Sync with the latest Hydrogen template"
          body: |
            Automated re-scaffold from Hydrogen's published React Router template, the same tarball `npx @shopify/hydrogen setup` uses. Review the diff, run it locally, and merge to keep the starter current.
          labels: dependencies
