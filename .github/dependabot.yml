version: 2
updates:
  # Only the workflow actions are kept current by Dependabot. The app dependencies
  # are owned by the Hydrogen template and refreshed by the weekly
  # "Sync with the latest Hydrogen template" workflow, so Dependabot bumps to
  # individual npm packages would fight that sync and drift from the template.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
